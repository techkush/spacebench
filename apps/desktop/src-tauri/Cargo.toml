[package]
name = "spicebench"
version = "0.1.0"
description = "Space Bench — circuit design & simulation"
authors = ["Space Bench"]
license = "MIT"
repository = "https://github.com/techkush/spacebench"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "spicebench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
sb-engine = { path = "../../../engine" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
libloading = "0.8"
tauri-plugin-opener = "2"
